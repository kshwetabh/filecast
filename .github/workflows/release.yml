name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: build-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install scriptc
        run: npm ci

      - name: Download zig toolchain
        shell: pwsh
        run: |
          curl.exe -L -o zig.zip https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip
          tar.exe -xf zig.zip

      - name: Compile filecast.exe
        shell: pwsh
        env:
          SCRIPTC_CC: zigcc
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\zig-x86_64-windows-0.16.0;$env:PATH"
          & "node_modules\.bin\scriptc.cmd" build filecast.ts -o filecast.exe
          Get-Item filecast.exe | Select-Object Name, Length

      - name: Compute checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash filecast.exe -Algorithm SHA256).Hash
          "$hash  filecast.exe" | Set-Content filecast.exe.sha256
          Get-Content filecast.exe.sha256

      - name: Package zip (fewer antivirus false alarms + no download flag)
        shell: pwsh
        run: |
          Compress-Archive -Path filecast.exe, filecast.exe.sha256 -DestinationPath filecast.zip
          Get-Item filecast.zip | Select-Object Name, Length

      - name: Publish rolling release (every push to main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --yes --cleanup-tag 2>$null | Out-Null
          gh release create continuous filecast.exe filecast.exe.sha256 filecast.zip --title "Latest build" --notes "Automatically built from commit $env:GITHUB_SHA on main."

      - name: Publish versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME filecast.exe filecast.exe.sha256 filecast.zip --generate-notes
